name: family_ai_english_app
description: "A gamified AI English learning app designed for a family of 6, built with Flutter, Provider, Hive, Supabase, and Google Gemini API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_generative_ai: ^0.4.0
  http: ^1.2.0
  supabase_flutter: ^2.3.4
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
